<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        // code for (FOR LOOP)

        // for(let i=1; i<=10;i++){
        //     document.write("<br> abes college");
        // }

        const car = ["car1","car2","car3"];
        let text = " "; // null charecter
        for(i=0;i<car.length;i++){
            if(i%2 ==0)
            text +=car[i] + "<br>";
        }
        document.getElementById("demo").innerHTML=text;
        // document.write(text);
    </script>
</body>
</html>
