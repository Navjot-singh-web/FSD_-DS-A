<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaters</title>
</head>
<body>
    <script>
        let a = 12;
        let b = 30;
        let c=a+b;
        console.log(a+"+"+b+ "="+c );
        c = a-b;
        console.log(a+"-"+b+ "="+c);
        c = a*b;
        console.log(a+"x"+b+ "="+c);
        a=20;
        b=2;
        c= a/b;
        console.log(a+"/"+b+ "="+c);
        c= a==b;
         console.log(a+"=="+b+ ":"+c);
        c = a>b;
        console.log(a+">"+b+ ":"+c);
        c = a<b;
        console.log(a+"<"+b+ ":"+c);
      
    </script>
</body>
</html>
